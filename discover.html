<!DOCTYPE html>
<html>
    <head>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik+Dirt&family=Rubik+Doodle+Shadow&family=Rubik+Glitch&family=Rubik+Mono+One&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap');
    </style>
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Exopossibilities-Discover</title>
        <link rel = "stylesheet" type = "text/css" href = "stylesheets/discover.css"/>
        <link rel = "stylesheet" type = "text/css" href = "stylesheets/nav-menu.css"/>
    </head>
    <body>
      <div id="parallax"></div>
        <span id = "display-nav-button" onclick = "displayNav()">☰</span>
            <div id = "side-bar">
              <span id="b" onclick="history.back()"><p>Back</p></span>
              <span id = "d" onclick = "window.location.href = 'discover.html'"><p>Discover</p></span>
              <span id = "g" onclick = "window.location.href = 'glossary.html'"><p>Glossary</p></span>
              <span id = "h" onclick = "window.location.href = 'index.html'"><p>Home</p></span>
              <span id = "m" onclick = "window.location.href = 'map.html'"><p>Locator</p></span>
              <span id = "q" onclick = "window.location.href = 'quiz.html'"><p>Quiz</p></span>
              <span id = "t" onclick = "navPlanetOfTheDay()"><p>Today's Planet</p></span>
            </div>
        <input type="Search" id="search-input" placeholder="Search by planet name..." autocomplete="off"><br>
        <div id="filters">
         <div class="filter-group">
  <label>Distance from Earth (parsecs)</label>
  <div class="dist-row">
    Min: <input type="number" id="dist-min" min="0" max="10000" value="0" oninput="
      if (+this.value > +document.getElementById('dist-max').value)
        this.value = document.getElementById('dist-max').value;
      applyFilters()">
    Max: <input type="number" id="dist-max" min="0" max="10000" value="10000" oninput="
      if (+this.value < +document.getElementById('dist-min').value)
        this.value = document.getElementById('dist-min').value;
      applyFilters()">
  </div>
</div>
      <div class="filter-group">
  <label>Calculated ESI Score</label>
  <div class="esi-row">
    Min: <input type="number" id="esi-min" min="0.0" max="1.0" value="0.0" oninput="
      if (+this.value > +document.getElementById('esi-max').value)
        this.value = document.getElementById('esi-max').value;
      applyFilters()">
    Max: <input type="number" id="esi-max" min="0.0" max="1.0" value="1.0" oninput="
      if (+this.value < +document.getElementById('esi-min').value)
        this.value = document.getElementById('esi-min').value;
      applyFilters()">
  </div>
</div>
       <div class="filter-group">
          <label>Habitability</label>
          <select id="habitable-filter">
       <option value="all">All</option>
       <option value="habitableC">Conservative Habitable</option>
       <option value="habitableO">Optimistic Habitable</option>
       <option value="not-habitable">Not Habitable</option>
      </select>
        </div>
        <div class="filter-group">
        <div class="toggle-container">
  <span class="toggle-label">Show Medalists Only</span>
  <label class="toggle-switch">
    <input type="checkbox" id="medalist-filter">
    <span class="slider"></span>
  </label>
</div>
        </div>
        <div class="filter-group">
          <span id="Random">Go to random planet</span>
        </div>
        </div>
        <div id = "planet_list"></div>
        <script src="jsFiles/img.js"></script>
        <script src="jsFiles/nav.js"></script>
        <script src="jsFiles/s.js"></script>
        <script src="jsFiles/planet.js"></script>
    </body>
</html>
